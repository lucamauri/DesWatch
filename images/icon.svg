<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="roundedSquare">
      <rect width="128" height="128" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" ry="22" fill="#1A1C1E"/>

  <!-- Swatch grid: 2x2 color squares, slightly offset as a "card" -->
  <!-- Bottom-right shadow card (lifted effect) -->
  <rect x="34" y="34" width="62" height="62" rx="8" fill="#111315" opacity="0.6" transform="translate(4,4)"/>

  <!-- Swatch card background -->
  <rect x="34" y="34" width="62" height="62" rx="8" fill="#2A2D30"/>

  <!-- Top-left swatch: deep ink -->
  <rect x="40" y="40" width="24" height="24" rx="4" fill="#1A1C1E" stroke="#3A3D40" stroke-width="1"/>

  <!-- Top-right swatch: terracotta / accent -->
  <rect x="68" y="40" width="24" height="24" rx="4" fill="#B8422E"/>

  <!-- Bottom-left swatch: slate -->
  <rect x="40" y="68" width="24" height="24" rx="4" fill="#6C7278"/>

  <!-- Bottom-right swatch: warm limestone -->
  <rect x="68" y="68" width="24" height="24" rx="4" fill="#F7F5F2"/>

  <!-- "Lifted" corner fold on top-right to suggest document/file -->
  <polyline points="82,34 96,34 96,48" fill="none" stroke="#B8422E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Small eye/lens indicator — bottom right of card, the "Watch" part -->
  <circle cx="96" cy="96" r="10" fill="#1A1C1E" stroke="#B8422E" stroke-width="2"/>
  <circle cx="96" cy="96" r="4" fill="#B8422E"/>
</svg>
