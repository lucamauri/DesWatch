name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}

      - run: npm ci

      - run: npm run compile

      - name: Install Xvfb
        run: sudo spt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a npm test
